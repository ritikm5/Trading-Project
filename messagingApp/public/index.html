<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
<div id="login">
    <input id="name" placeholder="Name" autocomplete="off" />
    <input id="password" type="password" placeholder="Password" autocomplete="off" />
    <button onclick="login()">Login</button>
    <div id="error"></div>
</div>

  <!-- Chat Screen (hidden until login) -->
<div id="chat" style="display:none;">
    <div id="messages"></div>
  
    <!-- Input area: message + attach + send -->
    <div id="input-area">
        <input id="message" placeholder="Type message..." autocomplete="off" />
    
        <!-- Hidden file input -->
        <input type="file" id="file-input" style="display:none;" accept="*/*" />
    
        <!-- Attach button -->
        <!-- Attach button - improved trigger -->
        <button class="attach" id="attach-button">Attach</button>
    
        <!-- Send button -->
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

</body>
</html>
